<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأكاديمية اليابانية للكاراتيه</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0F3;--card:#FFFFFF;--ink:#1B2433;--mute:#667085;--line:#D9DDE3;--red:#C8102E;--indigo:#2A3344;--ok:#1F7A4D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121722;--card:#1B2231;--ink:#EDEFF3;--mute:#9AA3B2;--line:#2C3548;--red:#E5384F;--indigo:#9DB0DB;--ok:#4CC58A}}
:root[data-theme="dark"]{--bg:#121722;--card:#1B2231;--ink:#EDEFF3;--mute:#9AA3B2;--line:#2C3548;--red:#E5384F;--indigo:#9DB0DB;--ok:#4CC58A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Kufi Arabic",Tahoma,Arial,sans-serif;line-height:1.7}
header{position:relative;overflow:hidden;background:#C6C6C6;color:#15181F;padding:18px 20px}

.logo{height:118px;width:auto;flex:none;mix-blend-mode:multiply}.bt{flex:1;min-width:0}.pr{background:#15181F;color:#fff;padding:8px 16px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input{max-width:260px}.btn.sec{background:var(--indigo);color:#fff}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.sec{color:#0C111B}}@media print{header nav,.pr,form,.tools,.btn.ghost,.noprint{display:none!important}header{background:#fff!important;color:#000}body{background:#fff}.panel,.stat{break-inside:avoid}}@media (max-width:520px){.logo{height:82px}h1{font-size:19px}.pr{display:none}}
.brand{display:flex;align-items:center;gap:14px;max-width:960px;margin:auto}
h1{margin:0;font-size:26px;font-weight:800}
.sub{margin:2px 0 0;font-size:13px;color:#3d4350;direction:ltr;text-align:right}.hello{background:var(--card);border:1px solid var(--line);border-right:5px solid var(--red);border-radius:10px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.hello b{font-size:16px}.hello span{color:var(--mute);font-size:13px}.bar{height:10px;border-radius:5px;background:var(--bg);flex:1;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}.br{display:flex;align-items:center;gap:12px;margin:9px 0;font-size:14px}.br .belt{width:90px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
nav{display:flex;gap:4px;background:#15181F;border-top:4px solid var(--red);padding:0 max(12px,calc((100% - 960px)/2));overflow-x:auto}
nav button{flex:1;min-width:max-content;background:transparent;border:0;border-bottom:3px solid transparent;color:#fff;opacity:.7;font:inherit;font-size:14px;padding:8px 12px;cursor:pointer}
nav button.on{opacity:1;border-color:var(--red);font-weight:600}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font-size:30px;font-weight:800}
.stat span{color:var(--mute);font-size:13px}
.stat.red b{color:var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 12px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{font-size:13px;color:var(--mute);display:grid;gap:4px}
input,select{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.btn{font:inherit;font-size:14px;background:var(--red);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--red);border:1px solid var(--red);padding:5px 10px;font-size:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:13px}
.belt{display:inline-flex;align-items:center;gap:6px}
.belt i{width:26px;height:8px;border-radius:2px;border:1px solid var(--line);display:inline-block}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.no{color:var(--red);border-color:var(--red)}
.empty{color:var(--mute);text-align:center;padding:22px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:20px;height:20px}
@media (prefers-reduced-motion:no-preference){main>section{animation:in .25s ease}@keyframes in{from{opacity:.4}to{opacity:1}}}
.res{padding:14px 16px;border-radius:10px;font-weight:600;margin-bottom:14px;border:1px solid;background:var(--card)}.res.ok{color:var(--ok);border-color:var(--ok)}.res.no{color:var(--red);border-color:var(--red)}.note{color:var(--mute);font-size:13px;margin:0 0 12px}#vid{display:none;width:100%;max-width:420px;border-radius:10px;margin-top:12px;background:#000}#ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;overflow:auto;display:flex;justify-content:center;padding:20px}.ovw{margin:auto;display:grid;gap:12px;justify-items:center}.ovb{display:flex;gap:8px}.pcard{width:300px;background:#fff;color:#15181F;border-radius:14px;overflow:hidden;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}.pt{background:#C6C6C6;border-bottom:4px solid #C8102E;padding:8px}.pt img{height:78px;mix-blend-mode:multiply}.pb{padding:14px 16px 16px}.pb h3{margin:0 0 2px;font-size:20px}.pc{font-size:24px;font-weight:800;letter-spacing:2px;color:#C8102E}.pq{width:190px;height:190px;image-rendering:pixelated;margin:8px auto;display:block}.pm{font-size:13px;color:#555;margin-top:6px}.pm .belt{color:#15181F}@media print{body.pc>header,body.pc>nav,body.pc>main{display:none!important}body.pc #ov{position:static;background:none;padding:0}body.pc .ovb{display:none}body.pc .pcard{box-shadow:none;border:1px solid #999;margin:0 auto}}
.days{display:flex;gap:8px;flex-wrap:wrap}.dy{display:flex;flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);font-size:14px}.dy input{width:auto}a.btn{text-decoration:none;display:inline-block}.pill{display:inline-block;margin-top:6px;font-size:12px;padding:1px 10px;border-radius:99px;border:1px solid #666;color:#3d4350}.pill:empty{display:none}.pill.on{color:#1F7A4D;border-color:#1F7A4D}.pill.off{color:#C8102E;border-color:#C8102E}</style>
</head>

<script>
var BELTS=[["أبيض","#FFFFFF"],["أصفر","#F2C500"],["برتقالي","#F28C28"],["أخضر","#2E9D5B"],["أزرق","#2D6CDF"],["بني","#7A4A2B"],["أسود","#111111"]];
var TABS=[["dash","لوحة التحكم"],["stu","اللاعبون"],["att","الحضور"],["pay","الاشتراكات"],["set","الإعدادات"]];
var S={students:[],att:{},pay:{},tm:{},seq:0};
var TD=[0,2,4],DN=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],PER=12;
function pl(s){return s.plan||PER}
function tdTxt(){return TD.slice().sort().map(function(i){return DN[i]}).join(" و ")}
function wa(s){var n=String(s.phone||"").replace(/\D/g,"");if(n.indexOf("0")===0)n="20"+n.slice(1);var t="مرحباً، اشتراك "+s.name+" في الأكاديمية اليابانية للكاراتيه "+(s.left<=0?"انتهى":"قارب على الانتهاء (باقي "+s.left+" حصة)")+". برجاء التجديد.";return "https://wa.me/"+n+"?text="+encodeURIComponent(t)}
function pad(n){return "JKA"+String(n).padStart(4,"0")}
var tab="dash";
function normS(){
  S.tm=S.tm||{};S.att=S.att||{};S.pay=S.pay||{};S.seq=S.seq||0;S.cfg=S.cfg||{per:12,days:[0,2,4]};PER=S.cfg.per;TD=S.cfg.days;
  S.students.forEach(function(s){var m=/^JKA(\d+)$/.exec(s.code||"");if(m)S.seq=Math.max(S.seq,+m[1])});
  S.students.forEach(function(s){if(!s.code)s.code=pad(++S.seq);if(!s.plan)s.plan=s.left==null?PER:Math.max(PER,s.left);if(s.left==null)s.left=s.plan});
}
function load(){try{var d=localStorage.getItem("jka_v1");if(d){var o=JSON.parse(d);if(o&&o.students){S=o}}}catch(e){}normS();save()}
function saveLocal(){try{localStorage.setItem("jka_v1",JSON.stringify(S))}catch(e){}}
function save(){saveLocal();if(DB){lock=Date.now()+1500;syncDb()}}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function month(){return today().slice(0,7)}
function beltCell(i){var b=BELTS[i]||BELTS[0];return '<span class="belt"><i style="background:'+b[1]+'"></i>'+b[0]+'</span>'}
function paid(id,m){return !!S.pay[id+":"+m]}

  var inc=P.reduce(function(a,s){return a+(+s.fee||0)},0),t=(S.att[today()]||[]).length;
  var late=S.students.filter(function(s){return s.left<=2});

  '<div class="grid"><div class="stat"><b>'+n+'</b><span>عدد اللاعبين</span></div>'+
  '<div class="stat"><b>'+t+'</b><span>حاضرون اليوم</span></div>'+
  '<div class="stat"><b>'+p+'</b><span>تجديدات هذا الشهر</span></div>'+
  '<div class="stat red"><b>'+S.students.filter(function(s){return s.left<=0}).length+'</b><span>اشتراكات منتهية</span></div>'+
  '<div class="stat"><b>'+inc+'</b><span>إيراد هذا الشهر</span></div></div>'+

  '<div class="panel"><h2>اشتراكات تحتاج تجديد</h2>'+(late.length?late.map(function(s){return '<div class="chk" style="cursor:default"><span style="flex:1">'+esc(s.name)+'</span><span style="color:var(--red)">'+(s.left<=0?"منتهي":"باقي "+s.left+" حصة")+'</span>'+(s.phone?'<a class="btn ghost" target="_blank" rel="noopener" href="'+wa(s)+'">واتساب</a>':'')+'</div>'}).join(""):'<div class="empty">'+(n?"لا توجد اشتراكات تحتاج تجديد.":"لا توجد بيانات بعد.")+'</div>')+'</div></div></section>';
}

  S.seq=N.length;S.students=N.map(function(n,i){return{id:"d"+i,code:pad(i+1),name:n,phone:"01"+(i%3)+"00000"+(100+i),belt:i%6,fee:300,joined:t,plan:12,left:L[i]}});

function csv(){
  var r=[["الكود","الاسم","الهاتف","الحزام","قيمة الاشتراك","الحصص المتبقية","تاريخ الانضمام"]];
  S.students.forEach(function(s){r.push([s.code,s.name,s.phone,BELTS[+s.belt][0],s.fee,s.left,s.joined])});

var attDate=today(),msg=null,stream=null,raf=0,last="",lastT=0,cv=document.createElement("canvas");
function mark(code){
  var s=byCode(code),t=today();
  if(!s){msg={ok:0,t:"الكود غير موجود: "+String(code).trim()};beep(0);return}
  var l=S.att[t]||[];
  if(l.indexOf(s.id)>-1){msg={ok:0,t:s.name+" مسجّل حضور اليوم بالفعل"};beep(0);return}
  if(s.left<=0){msg={ok:0,t:"اشتراك "+s.name+" منتهي، جدّد الاشتراك من تبويب الاشتراكات"};beep(0);return}
  if(!isTD(new Date())&&!confirm("اليوم ليس من أيام التمرين ("+tdTxt()+"). تسجيل الحضور مع ذلك؟"))return;
  l.push(s.id);S.att[t]=l;S.tm[s.id+":"+t]=nowT();s.left--;save();beep(1);
  msg={ok:1,t:"تم تسجيل حضور "+s.name+"، باقي "+s.left+" من "+pl(s)+" حصة"+(s.left<=2?" (تنبيه: الاشتراك قارب على الانتهاء)":"")};
}
function unmark(id){
  var l=S.att[attDate]||[],i=l.indexOf(id);if(i<0)return;
  l.splice(i,1);delete S.tm[id+":"+attDate];var s=byId(id);if(s)s.left++;save();msg=null;
}

}

function camOn(){
  if(!navigator.mediaDevices||!window.jsQR){alert("الماسح غير متاح هنا. استخدم كتابة الكود أو جهاز الباركود.");return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(st){
    stream=st;var v=document.getElementById("vid");if(!v){camOff();return}
    v.srcObject=st;v.style.display="block";v.play();document.getElementById("camb").textContent="إيقاف الكاميرا";loop();
  }).catch(function(){alert("تعذر فتح الكاميرا. اسمح بالوصول للكاميرا، أو افتح الرابط مباشرة في المتصفح، أو اكتب الكود.")});
}
function camOff(){
  cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
  var v=document.getElementById("vid");if(v){v.style.display="none";v.srcObject=null}
  var b=document.getElementById("camb");if(b)b.textContent="فتح الكاميرا للمسح";
}
function loop(){
  var v=document.getElementById("vid");if(!stream||!v)return;
  if(v.readyState>=2&&v.videoWidth){
    cv.width=v.videoWidth;cv.height=v.videoHeight;var c=cv.getContext("2d",{willReadFrequently:true});c.drawImage(v,0,0);
    var d=c.getImageData(0,0,cv.width,cv.height),r=jsQR(d.data,d.width,d.height);
    if(r&&r.data&&(r.data!==last||Date.now()-lastT>3500)){last=r.data;lastT=Date.now();mark(r.data);refreshAtt()}
  }
  raf=requestAnimationFrame(loop);
}

document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.card){showCard(b.dataset.card);return}
  if(b.dataset.close){var o=document.getElementById("ov");if(o)o.remove();return}
  if(b.dataset.pc){document.body.classList.add("pc");window.print();return}
  if(b.id==="camb"){stream?camOff():camOn();return}
  if(b.dataset.un){unmark(b.dataset.un);refreshAtt();return}
  if(b.dataset.man){var mv=document.getElementById("man").value;if(mv){mark(byId(mv).code);refreshAtt()}return}
  if(b.dataset.ren){var rs=byId(b.dataset.ren);if(rs&&confirm("تجديد اشتراك "+rs.name+" بإضافة "+pl(rs)+" حصة؟")){rs.left=Math.max(rs.left,0)+pl(rs);S.pay[rs.id+":"+month()]=true;save();render()}return}
  if(b.dataset.adj){var as=byId(b.dataset.adj),v=prompt("الحصص المتبقية للاعب "+as.name,as.left);if(v!==null&&v.trim()!==""&&!isNaN(+v)){as.left=Math.max(0,Math.floor(+v));save();render()}return}
  if(b.dataset.bk){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="jka-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();return}
  if(b.dataset.demo){demo();return}
  if(b.id==="print"){window.print();return}
  if(b.dataset.csv){csv();return}
  if(b.dataset.ed){editId=b.dataset.ed;render();window.scrollTo(0,0);return}
  if(b.dataset.cancel){editId=null;render();return}
  if(b.dataset.t){tab=b.dataset.t;editId=null;render();return}
  if(b.dataset.del){if(confirm("حذف هذا اللاعب؟")){S.students=S.students.filter(function(s){return s.id!==b.dataset.del});save();render()}return}
  if(b.dataset.p){var k=b.dataset.p+":"+month();if(S.pay[k])delete S.pay[k];else S.pay[k]=true;save();render()}
});

var DB=null,canW=true,shadow={},lastSnap={},lock=0,lt=0;
function cj(v){if(Array.isArray(v))return "["+v.map(cj).join(",")+"]";if(v&&typeof v==="object")return "{"+Object.keys(v).sort().map(function(k){return JSON.stringify(k)+":"+cj(v[k])}).join(",")+"}";return JSON.stringify(v)}
function setStatus(t,c){var e=document.getElementById("sync");if(e){e.textContent=t;e.className="pill "+(c||"")}}
function docsFromS(){
  var d={},pm={};
  d["cfg/main"]={per:PER,days:TD,seq:S.seq};
  S.students.forEach(function(s){d["students/"+s.id]=JSON.parse(JSON.stringify(s))});
  Object.keys(S.att).forEach(function(k){var t={};(S.att[k]||[]).forEach(function(id){if(S.tm[id+":"+k])t[id]=S.tm[id+":"+k]});d["att/"+k]={ids:S.att[k]||[],tm:t}});
  Object.keys(S.pay).forEach(function(k){var i=k.lastIndexOf(":"),m=k.slice(i+1);(pm[m]=pm[m]||[]).push(k.slice(0,i))});
  Object.keys(pm).forEach(function(m){d["pay/"+m]={ids:pm[m]}});
  return d;
}
function failDb(e){
  console.error("db",e);
  if(e&&e.code==="invalid_argument"){canW=false;setStatus("قراءة فقط","off")}
  else{setStatus("خطأ في الاتصال","off")}
}
function syncDb(){
  if(!DB||!canW)return;
  var cur=docsFromS(),p;
  for(p in cur){var j=cj(cur[p]);if(shadow[p]!==j){shadow[p]=j;DB.doc(p).set(cur[p]).catch(failDb)}}
  for(p in shadow){if(!(p in cur)){delete shadow[p];DB.doc(p).delete().catch(failDb)}}
}
function clearShadow(pre){for(var k in shadow){if(k.indexOf(pre)===0)delete shadow[k]}}
function applyAll(){
  var w=lock-Date.now();if(w>0){clearTimeout(lt);lt=setTimeout(applyAll,w+60);return}
  var ss=lastSnap.students,aa=lastSnap.att,pp=lastSnap.pay,cc=lastSnap.cfg;lastSnap={};
  if(!ss&&!aa&&!pp&&!cc)return;
  if(ss){clearShadow("students/");S.students=ss.docs.map(function(d){var o=d.data();shadow["students/"+d.id]=cj(o);return o}).sort(function(a,b){return String(a.code).localeCompare(String(b.code))})}
  if(aa){clearShadow("att/");S.att={};S.tm={};aa.docs.forEach(function(d){var o=d.data();shadow["att/"+d.id]=cj(o);S.att[d.id]=(o.ids||[]).slice();Object.keys(o.tm||{}).forEach(function(k){S.tm[k+":"+d.id]=o.tm[k]})})}
  if(pp){clearShadow("pay/");S.pay={};pp.docs.forEach(function(d){var o=d.data();shadow["pay/"+d.id]=cj(o);(o.ids||[]).forEach(function(id){S.pay[id+":"+d.id]=true})})}
  if(cc&&cc.exists){var o=cc.data();shadow["cfg/main"]=cj(o);S.cfg={per:o.per||12,days:o.days&&o.days.length?o.days:[0,2,4]};S.seq=Math.max(S.seq||0,o.seq||0)}
  normS();saveLocal();softRender();
}
function softRender(){
  if(tab==="att")refreshAtt();
  else if(tab==="stu"){var l=document.getElementById("list");if(l)l.innerHTML=listHTML()}
  else if(tab==="dash"||tab==="pay")render();
}
function connect(){
  if(!window.claude||!window.claude.use)return;
  setStatus("جارٍ الاتصال…","");
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],u=r[1];
    if(!db){setStatus("محلي (بدون قاعدة مشتركة)","off");return}
    canW=u&&u.can?u.can("data.write")!==false:true;
    DB=db;
    return db.collection("students").get().then(function(snap){
      if(snap.empty&&S.students.length&&canW){shadow={};lock=Date.now()+2500;syncDb()}
      else if(!snap.empty){try{localStorage.setItem("jka_pre_db",JSON.stringify(S))}catch(e){}}
      db.collection("students").onSnapshot(function(s){lastSnap.students=s;applyAll()},failDb);
      db.collection("att").onSnapshot(function(s){lastSnap.att=s;applyAll()},failDb);
      db.collection("pay").onSnapshot(function(s){lastSnap.pay=s;applyAll()},failDb);
      db.doc("cfg/main").onSnapshot(function(s){lastSnap.cfg=s;applyAll()},failDb);
      setStatus(canW?"متصل بالقاعدة المشتركة":"قراءة فقط",canW?"on":"off");
    });
  }).catch(function(e){DB=null;failDb(e)});
}
window.addEventListener("afterprint",function(){document.body.classList.remove("pc")});
load();render();connect();
</script>
